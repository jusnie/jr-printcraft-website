<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f8fc;padding:32px 16px;font-family:Georgia, 'Times New Roman', serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" style="max-width:560px;background-color:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px -24px rgba(23,32,51,0.25);">

        <!-- Header -->
        <tr>
          <td style="background-color:#4a6e96;padding:28px 32px;">
            <p style="margin:0;font-family:Georgia, serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#cfe0f0;">Contact Form</p>
            <h1 style="margin:6px 0 0;font-family:Georgia, serif;font-size:24px;color:#ffffff;">New Website Message</h1>
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding:32px;font-family:Arial, Helvetica, sans-serif;">
            <p style="margin:0 0 20px;font-size:15px;color:#172033;">
              Someone sent you a message through the Contact section of your website.
            </p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-bottom:22px;">
              <tr>
                <td style="padding:10px 0;border-bottom:1px solid #e4e9f0;font-size:13px;color:#5a6779;width:35%;">From</td>
                <td style="padding:10px 0;border-bottom:1px solid #e4e9f0;font-size:14px;color:#172033;font-weight:bold;">{{customer_name}}</td>
              </tr>
              <tr>
                <td style="padding:10px 0;border-bottom:1px solid #e4e9f0;font-size:13px;color:#5a6779;">Email</td>
                <td style="padding:10px 0;border-bottom:1px solid #e4e9f0;font-size:14px;color:#172033;">
                  <a href="mailto:{{customer_email}}" style="color:#4a6e96;text-decoration:none;">{{customer_email}}</a>
                </td>
              </tr>
            </table>

            <div style="background-color:#f5f8fc;border-radius:14px;padding:18px 20px;margin-bottom:24px;">
              <p style="margin:0;font-size:14px;line-height:1.6;color:#172033;white-space:pre-line;">{{message}}</p>
            </div>

            <a href="mailto:{{customer_email}}" style="display:inline-block;background-color:#4a6e96;color:#ffffff;text-decoration:none;font-family:Arial, Helvetica, sans-serif;font-size:14px;font-weight:bold;padding:12px 24px;border-radius:12px;">
              Reply to {{customer_name}}
            </a>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background-color:#f5f8fc;padding:18px 32px;text-align:center;">
            <p style="margin:0;font-family:Arial, Helvetica, sans-serif;font-size:12px;color:#8d9aab;">
              Automated contact-form notification from your JR PrintCraft Express website.
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
